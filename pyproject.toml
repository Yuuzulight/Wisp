[project]
name = "wisp"
version = "0.1.0"
description = "Local answer-engine layer on top of SearXNG: rerank, extract, synthesize, cite — no index, no cache."
readme = "README.md"
authors = [
    { name = "Yuuzulight", email = "yuuzulight@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
wisp = "wisp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
